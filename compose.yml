    panel: &panel-environment
        APP_URL: 'https://kdm8zd-5173.csb.app/' # can be set to 'http://localhost' on port 80 only
        ADMIN_EMAIL: 'vibegames@slonexusrp.it'

        APP_DEBUG: 'false'
        APP_ENV: 'production'

    mail: &mail-environment
        MAIL_DRIVER: 'log'
        # MAIL_HOST: ""
